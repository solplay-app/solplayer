name: Build SolPlay Desktop (Windows)

# Lancement manuel (onglet Actions > Run workflow) ou automatique
# quand un tag de version "vX.Y.Z" est poussé.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Construire les installeurs (.msi et .exe)
        # TMDB_API_KEY : secret de dépôt optionnel (Settings > Secrets > Actions).
        # Sans lui, l'app fonctionne mais sans affiches TMDB.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        # Build RELEASE à partir d'un tag "vX.Y.Z" : la version de
        # l'installeur est fixée explicitement (-PreleaseVersion), donc
        # stable et déterministe pour un même tag. Les builds intermédiaires
        # (workflow_dispatch sans tag) gardent la version 1.0.<run>.
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v".ToCharArray())
            gradle packageMsi packageExe "-PreleaseVersion=$ver"
          } else {
            gradle packageMsi packageExe
          }

      - name: Publier les installeurs comme artefacts
        uses: actions/upload-artifact@v4
        with:
          name: SolPlay-Desktop-windows
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe

      - name: Publier une Release GitHub (si le build vient d'un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
